name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./mvnw -B package
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B package
      - name: Audit a public repo with the built jar
        shell: bash
        run: java -jar target/driftguard.jar audit https://github.com/e2b-dev/fragments --no-llm --out report.html
