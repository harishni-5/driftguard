name: DriftGuard
description: Comments on pull requests with new AI drift - duplicated logic, docs that don't match the code, and unused dependencies.
author: harishni-5
branding:
  icon: shield
  color: blue

inputs:
  fail-on:
    description: "Fail the check when the PR adds findings: none, likely (new likely issues) or any (also new leads)."
    default: none
  comment:
    description: Post or update a comment on the pull request. The summary is always written to the job summary either way.
    default: "true"
  github-token:
    description: Token used to comment. Needs pull-requests write permission.
    default: ${{ github.token }}

outputs:
  new-likely:
    description: Number of likely issues the PR adds.
    value: ${{ steps.diff.outputs.new-likely }}
  new-leads:
    description: Number of leads to review the PR adds.
    value: ${{ steps.diff.outputs.new-leads }}

runs:
  using: composite
  steps:
    - name: Check event
      if: github.event_name != 'pull_request'
      shell: bash
      run: |
        echo "::error::DriftGuard compares a pull request with its base, so run it on the pull_request event."
        exit 1

    - uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "21"

    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - uses: actions/setup-node@v4
      with:
        node-version: "22"

    - name: Build DriftGuard
      shell: bash
      working-directory: ${{ github.action_path }}
      run: ./mvnw -q -B package -DskipTests

    - name: Check out the base commit
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        git -C "$GITHUB_WORKSPACE" fetch --no-tags --depth=1 origin "$BASE_SHA"
        # Same folder name as the head checkout, so both audits see the repo under the same name.
        mkdir -p "$RUNNER_TEMP/driftguard-base"
        git -C "$GITHUB_WORKSPACE" worktree add --detach "$RUNNER_TEMP/driftguard-base/$REPO_NAME" "$BASE_SHA"

    # Static analysis only: no API key, nothing leaves the runner, and the same code always gives the same result.
    # The repo's code is parsed, never run, so auditing an untrusted PR is safe.
    - name: Audit base and head
      shell: bash
      env:
        REPO_NAME: ${{ github.event.repository.name }}
      run: |
        jar="$GITHUB_ACTION_PATH/target/driftguard.jar"
        java -jar "$jar" audit "$RUNNER_TEMP/driftguard-base/$REPO_NAME" --no-llm --db "$RUNNER_TEMP/driftguard.db" --out "$RUNNER_TEMP/driftguard-base.json"
        java -jar "$jar" audit "$GITHUB_WORKSPACE" --no-llm --db "$RUNNER_TEMP/driftguard.db" --out "$RUNNER_TEMP/driftguard-head.json"
        java -jar "$jar" audit "$GITHUB_WORKSPACE" --no-llm --db "$RUNNER_TEMP/driftguard.db" --out "$RUNNER_TEMP/driftguard-report.html"

    - name: Compare
      id: diff
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
        REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        set +e
        java -jar "$GITHUB_ACTION_PATH/target/driftguard.jar" diff \
          "$RUNNER_TEMP/driftguard-base.json" "$RUNNER_TEMP/driftguard-head.json" \
          --repo-url "$REPO_URL" --link-commit "$HEAD_SHA" --fail-on "$FAIL_ON" --out "$RUNNER_TEMP/driftguard-comment.md" | tee "$RUNNER_TEMP/driftguard-diff.txt"
        code=${PIPESTATUS[0]}
        set -e
        if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "new-likely=$(sed -n 's/^New likely issues: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/driftguard-diff.txt")" >> "$GITHUB_OUTPUT"
        echo "new-leads=$(sed -n 's/.*New leads: \([0-9]*\).*/\1/p' "$RUNNER_TEMP/driftguard-diff.txt")" >> "$GITHUB_OUTPUT"
        cat "$RUNNER_TEMP/driftguard-comment.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload full report
      uses: actions/upload-artifact@v4
      with:
        name: driftguard-report
        path: ${{ runner.temp }}/driftguard-report.html
        retention-days: 14

    # Pull requests from forks get a read-only token, so this can't comment there. The job summary still has it all.
    - name: Comment on the pull request
      if: inputs.comment == 'true'
      continue-on-error: true
      uses: actions/github-script@v7
      env:
        COMMENT_FILE: ${{ runner.temp }}/driftguard-comment.md
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.COMMENT_FILE, 'utf8');
          const marker = '<!-- driftguard-pr-comment -->';
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const mine = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
          if (mine) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Apply fail-on
      if: steps.diff.outputs.exit-code == '2'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::This pull request adds DriftGuard findings and fail-on is '$FAIL_ON'. See the PR comment or job summary."
        exit 1
